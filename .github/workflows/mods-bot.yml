name: Mods bot

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mods-bot
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'HomeRiz/hats-lite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: mkdir -p "$RUNNER_TEMP/mods-out"
      - run: node scripts/mods_update.mjs "$REPORT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ runner.temp }}/mods-out/report.md
      - run: cp custom_components/hats_lite/mods_pinned.json "$RUNNER_TEMP/mods-out/mods_pinned.json"
      - name: Upload the artifact with actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mods
          path: ${{ runner.temp }}/mods-out
          if-no-files-found: error
          retention-days: 7

  pr:
    needs: update
    if: github.repository == 'HomeRiz/hats-lite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the artifact with actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mods
          path: ${{ runner.temp }}/mods-out
      - name: Set up Node with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - id: validate
        run: node scripts/mods_validate.mjs "$RUNNER_TEMP/mods-out"
      - id: diff
        run: |
          if cmp -s "$RUNNER_TEMP/mods-out/mods_pinned.json" custom_components/hats_lite/mods_pinned.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp "$RUNNER_TEMP/mods-out/mods_pinned.json" custom_components/hats_lite/mods_pinned.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          sign-commits: true
          branch: mods/update-${{ steps.date.outputs.day }}
          commit-message: Update the pinned mod set
          title: Update the pinned mod set
          body-path: ${{ runner.temp }}/mods-out/report.md
          add-paths: custom_components/hats_lite/mods_pinned.json
