name: Thumbnails full

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      hats_sha:
        description: Full commit SHA of the HATS repository, empty to use scripts/full/hats_pin.txt
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: thumbs-full
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'HomeRiz/hats-lite'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    env:
      ENABLED: ${{ vars.THUMBS_FULL_ENABLED == 'true' }}
    steps:
      - id: check
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

  render:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    environment: thumbs-full
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out hats-lite with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: pin
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.hats_sha }}
        run: |
          sha="$INPUT_SHA"
          if [[ -z "$sha" ]]; then
            sha="$(tr -d '[:space:]' < scripts/full/hats_pin.txt)"
          fi
          if [[ "$sha" == *$'\n'* || "$sha" == *$'\r'* || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "the HATS pin must be one full 40 character lowercase commit SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Check out HATS with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HomeRiz/hats
          ref: ${{ steps.pin.outputs.sha }}
          ssh-key: ${{ secrets.HATS_DEPLOY_KEY }}
          path: hats
          persist-credentials: false
      - name: Set up Python with actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Set up Node with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      - run: python -c "import jinja2; v = tuple(int(p) for p in jinja2.__version__.split('.')[:3]); assert v >= (3, 1, 6), jinja2.__version__"
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: hats
      - name: Cache the HATS vendor folder with actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: hats/vendor
          key: hats-vendor-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ hashFiles('hats/scripts/fetch-mock-frontend.sh', 'hats/scripts/fetch-mock-mods.sh') }}
      - run: bash scripts/fetch-mock-frontend.sh
        working-directory: hats
      - run: bash scripts/fetch-mock-mods.sh
        working-directory: hats
      - run: npm run build:mock-frontend-bootstrap
        working-directory: hats
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-roboto fonts-dejavu-core && fc-cache -f
      - id: chrome
        run: echo "path=$(npx --no-install @puppeteer/browsers install chrome@150 --path "$RUNNER_TEMP/chrome" --format '{{path}}')" >> "$GITHUB_OUTPUT"
      - run: python scripts/thumbs_collect.py "$RUNNER_TEMP/full-data"
      - name: Allow unprivileged user namespaces for the template worker
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "could not change kernel.apparmor_restrict_unprivileged_userns"
          fi
          if unshare -rn true; then
            echo "unprivileged network namespaces are available"
          else
            echo "unprivileged network namespaces are not available, the render step will fail closed"
          fi
      - run: node scripts/full/render.mjs "$RUNNER_TEMP/full-data/data.json" "$RUNNER_TEMP/full-out"
        env:
          HATS_DIR: ${{ github.workspace }}/hats
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          PYTHON: python
          HATS_REQUIRE_NETNS: "1"
      - name: Upload the renders with actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thumbs-full
          path: ${{ runner.temp }}/full-out
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: render
    if: needs.render.result == 'success' && github.ref == 'refs/heads/main'
    environment: thumbs-full
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out hats-lite with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Download the renders with actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: thumbs-full
          path: ${{ runner.temp }}/full-out
      - id: stage
        run: node scripts/full/publish.mjs "$RUNNER_TEMP/full-out" "$RUNNER_TEMP/release"
      - name: Create the renders release on the first run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view renders > /dev/null 2>&1; then
            gh release create renders --latest=false --target "$GITHUB_SHA" --title "Real renders" --notes "Full fidelity theme renders for the hats-lite panel."
          fi
      - name: Delete stale assets that were last updated more than 14 days ago
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/renders" --jq .id)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[]' > "$RUNNER_TEMP/old-assets.json"
          node -e 'const fs = require("fs"); const keep = new Set(fs.readdirSync(process.argv[1])); const cutoff = Date.now() - 14 * 86400000; const stale = []; let retained = 0; for (const line of fs.readFileSync(process.argv[2], "utf8").split("\n")) { if (!line.trim()) continue; let a; try { a = JSON.parse(line); } catch { retained += 1; continue; } if (typeof a.name !== "string" || keep.has(a.name)) continue; const t = Date.parse(a.updated_at); if (Number.isFinite(t) && t < cutoff && /^[A-Za-z0-9_][A-Za-z0-9_.-]*$/.test(a.name)) stale.push(a.name); else retained += 1; } fs.writeFileSync(process.argv[3], stale.map((n) => n + "\n").join("")); fs.writeFileSync(process.argv[4], retained + "\n");' "$RUNNER_TEMP/release" "$RUNNER_TEMP/old-assets.json" "$RUNNER_TEMP/stale-assets" "$RUNNER_TEMP/retained-count"
          while IFS= read -r name; do
            gh release delete-asset --yes renders -- "$name" < /dev/null
          done < "$RUNNER_TEMP/stale-assets"
      - name: Check the asset budget of the renders release before the upload
        shell: bash
        run: |
          retained="$(cat "$RUNNER_TEMP/retained-count")"
          staged="$(ls "$RUNNER_TEMP/release" | wc -l)"
          total=$((staged + retained))
          if [ "$total" -gt 950 ]; then
            echo "the renders release would hold $total assets ($staged new plus $retained retained), over the budget of 950" >&2
            exit 1
          fi
      - name: Upload the images and then the index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          ls | grep -v '^index\.json$' | xargs -d '\n' gh release upload renders --clobber
          gh release upload renders index.json --clobber
