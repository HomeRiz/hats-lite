name: Thumbnails

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'HomeRiz/hats-lite'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python with actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Set up Node with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-roboto fonts-dejavu-core && fc-cache -f
      - id: chrome
        run: echo "path=$(npx --no-install @puppeteer/browsers install chrome@150 --path "$RUNNER_TEMP/chrome" --format '{{path}}')" >> "$GITHUB_OUTPUT"
      - run: python scripts/thumbs_collect.py "$RUNNER_TEMP/thumbs"
      - run: node scripts/thumbs-render.mjs "$RUNNER_TEMP/thumbs"
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - name: Upload the artifact with actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thumbs
          path: custom_components/hats_lite/frontend/thumbs
          if-no-files-found: error
          retention-days: 3

  pr:
    needs: render
    if: github.repository == 'HomeRiz/hats-lite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the artifact with actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: thumbs
          path: ${{ runner.temp }}/thumbs-out
      - name: Set up Node with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - id: validate
        run: node scripts/thumbs_validate.mjs "$RUNNER_TEMP/thumbs-out"
      - id: copy
        run: |
          rm -rf custom_components/hats_lite/frontend/thumbs
          mkdir -p custom_components/hats_lite/frontend/thumbs
          cp "$RUNNER_TEMP/thumbs-out/atlas-dark.webp" "$RUNNER_TEMP/thumbs-out/atlas-light.webp" "$RUNNER_TEMP/thumbs-out/index.json" custom_components/hats_lite/frontend/thumbs/
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          sign-commits: true
          branch: thumbs/update
          commit-message: Refresh the theme thumbnails
          title: Refresh the theme thumbnails
          body: Rebuilt the theme thumbnail atlas from the public HACS theme list.
          add-paths: custom_components/hats_lite/frontend/thumbs
