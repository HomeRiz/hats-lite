name: Thumbnails

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-roboto fonts-dejavu-core && fc-cache -f
      - id: chrome
        run: echo "path=$(npx --no-install @puppeteer/browsers install chrome@150 --path "$RUNNER_TEMP/chrome" --format '{{path}}')" >> "$GITHUB_OUTPUT"
      - run: python scripts/thumbs_collect.py "$RUNNER_TEMP/thumbs"
      - run: node scripts/thumbs-render.mjs "$RUNNER_TEMP/thumbs"
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - uses: actions/upload-artifact@v7
        with:
          name: thumbs
          path: custom_components/hats_lite/frontend/thumbs
          if-no-files-found: error
          retention-days: 3

  pr:
    needs: render
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: thumbs
          path: custom_components/hats_lite/frontend/thumbs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          sign-commits: true
          branch: thumbs/update
          commit-message: Refresh the theme thumbnails
          title: Refresh the theme thumbnails
          body: Rebuilt the theme thumbnail atlas from the public HACS theme list.
          add-paths: custom_components/hats_lite/frontend/thumbs
