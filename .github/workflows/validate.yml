name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
          ignore: hacsjson integration_manifest
          comment: false

  hassfest:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
